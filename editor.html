<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Aspen sprite editor</title>
<style>
:root{color-scheme:dark}
body{margin:0;padding:12px;background:#14172b;color:#e8ecff;font:15px/1.4 system-ui,sans-serif}
h1{font-size:20px;margin:0 0 4px}
.s{margin:0 0 10px;color:#a9b3e0}
button,.btn{background:#27305a;color:inherit;border:1px solid #3d4a85;border-radius:8px;padding:8px 10px;font:inherit;cursor:pointer}
button.on{background:#4a62b0;border-color:#9fb2ff}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;align-items:center}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
.wrap{max-width:100%;max-height:72vh;overflow:auto;border-radius:8px;background-color:#cfd6ea;background-image:linear-gradient(45deg,#bcc5df 25%,transparent 25%,transparent 75%,#bcc5df 75%),linear-gradient(45deg,#bcc5df 25%,transparent 25%,transparent 75%,#bcc5df 75%);background-size:16px 16px;background-position:0 0,8px 8px}
#cv{display:block;touch-action:none;image-rendering:pixelated;cursor:crosshair}
.sw{width:34px;height:34px;padding:0;border-radius:6px}
.sw.on{outline:3px solid #fff}
#pv{image-rendering:pixelated;background:linear-gradient(#f7b267,#e8728a);border-radius:8px;display:block}
#cc{width:44px;height:36px;padding:0;border:0;background:none}
#msg{color:#9fe8b0;min-height:1.4em}
#out{display:none;width:100%;height:120px;margin-top:8px;background:#0d1020;color:#e8ecff}
label{display:flex;gap:6px;align-items:center}
.side{display:flex;flex-direction:column;gap:8px}
</style>
</head>
<body>
<h1>Aspen sprite editor</h1>
<p class="s">Paint Aspen pixel by pixel, then download <code>shark-art.js</code> and drop it into the <code>js/</code> folder.</p>

<div class="bar" id="tools"></div>
<div class="bar"><span>Frame:</span><span class="bar" id="tabs" style="margin:0"></span></div>

<div class="row">
  <div class="wrap" id="wrap"><canvas id="cv"></canvas></div>
  <div class="side">
    <canvas id="pv" width="162" height="234"></canvas>
    <button id="an" class="on">Animation: on</button>
    <div class="bar"><button id="undo">Undo</button><button id="redo">Redo</button></div>
    <div class="bar"><button id="nL">&larr;</button><button id="nU">&uarr;</button><button id="nD">&darr;</button><button id="nR">&rarr;</button></div>
    <div class="bar"><button id="cfb">Copy from Base</button><button id="clr">Clear</button></div>
    <label>Zoom <input type="range" id="z" min="4" max="14"></label>
    <label><input type="checkbox" id="gr" checked> Grid</label>
    <label><input type="checkbox" id="on" checked> Ghost of Base</label>
  </div>
</div>

<div class="bar" id="pal"></div>
<div class="bar"><span>Colour:</span><input type="color" id="cc"><button id="add">+ New colour</button></div>

<div class="bar">
  <button id="dl" class="on">Download shark-art.js</button>
  <button id="cp">Copy code</button>
  <label class="btn">Import <input type="file" id="imp" accept=".js,.json,.txt" hidden></label>
  <button id="ld">Load site version</button>
  <button id="rs">Start over (generated)</button>
</div>
<div id="msg"></div>
<textarea id="out" readonly></textarea>

<script src="js/shark.js"></script>
<script src="js/shark-art.js"></script>
<script>
(function () {
  'use strict';
  var S = window.AspenSprite, SW = S.SW, SH = S.SH, PAL = S.PAL;
  var ORIG = JSON.parse(JSON.stringify(PAL));
  var $ = function (i) { return document.getElementById(i); };
  var NAMES = ['base', 'blink', 'swing', 'tail'];
  var LABEL = { base: 'Base', blink: 'Blink', swing: 'Foot swing', tail: 'Tail up' };
  var F = {}, undo = {}, redo = {}, cur = 'base', tool = 'pen', col = 'b';
  var zoom = Math.max(4, Math.min(10, Math.floor((window.innerWidth - 24) / SW)));
  var down = false, last = null, start = null, snap = null, anim = true, t = 0, KEY = 'aspen-sprite-draft';
  var cv = $('cv'), cx = cv.getContext('2d'), pv = $('pv'), pc = pv.getContext('2d');

  function clone(g) { return g.map(function (r) { return r.slice(); }); }
  function rows(g) { return g.map(function (r) { return r.join(''); }); }
  function toGrid(rs) { return rs.map(function (r) { return r.split(''); }); }
  function blank() { var g = []; for (var y = 0; y < SH; y++) g.push(new Array(SW).fill('.')); return g; }
  function same(a, b) { return rows(a).join('|') === rows(b).join('|'); }
  function art() {
    var o = { pal: {}, base: rows(F.base) };
    Object.keys(PAL).forEach(function (k) { o.pal[k] = PAL[k]; });
    NAMES.slice(1).forEach(function (n) { if (!same(F[n], F.base)) o[n] = rows(F[n]); });
    return o;
  }
  function resetHist() { NAMES.forEach(function (n) { undo[n] = []; redo[n] = []; }); }
  function restorePal() { Object.keys(PAL).forEach(function (k) { delete PAL[k]; }); Object.keys(ORIG).forEach(function (k) { PAL[k] = ORIG[k]; }); }
  function loadProc() {
    restorePal();
    F.base = S.buildProc({}); F.blink = S.buildProc({ blink: true });
    F.swing = S.buildProc({ swing: 1 }); F.tail = S.buildProc({ tail: 2 });
  }
  function loadArt(a) {
    Object.keys(a.pal || {}).forEach(function (k) { PAL[k] = a.pal[k]; });
    F.base = toGrid(a.base);
    NAMES.slice(1).forEach(function (n) { F[n] = a[n] ? toGrid(a[n]) : clone(F.base); });
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(art())); } catch (e) {} }
  function msg(s) { $('msg').textContent = s; setTimeout(function () { $('msg').textContent = ''; }, 2500); }

  /* ---------- drawing the editor canvas ---------- */
  function paint(g) {
    for (var y = 0; y < SH; y++) for (var x = 0; x < SW; x++) {
      var k = g[y][x]; if (k === '.') continue;
      cx.fillStyle = PAL[k] || '#f0f'; cx.fillRect(x * zoom, y * zoom, zoom, zoom);
    }
  }
  function draw() {
    cx.clearRect(0, 0, cv.width, cv.height);
    if ($('on').checked && cur !== 'base') { cx.globalAlpha = 0.3; paint(F.base); cx.globalAlpha = 1; }
    paint(F[cur]);
    if ($('gr').checked && zoom >= 6) {
      cx.strokeStyle = 'rgba(0,0,0,.18)'; cx.lineWidth = 1; cx.beginPath();
      for (var x = 0; x <= SW; x++) { cx.moveTo(x * zoom + 0.5, 0); cx.lineTo(x * zoom + 0.5, SH * zoom); }
      for (var y = 0; y <= SH; y++) { cx.moveTo(0, y * zoom + 0.5); cx.lineTo(SW * zoom, y * zoom + 0.5); }
      cx.stroke();
    }
    cx.strokeStyle = '#ff5a5a'; cx.setLineDash([5, 4]); cx.beginPath();   // deck surface (hips sit just above this line)
    cx.moveTo(0, S.SEAT * zoom); cx.lineTo(SW * zoom, S.SEAT * zoom); cx.stroke(); cx.setLineDash([]);
  }
  function size() { cv.width = SW * zoom; cv.height = SH * zoom; cv.style.width = cv.width + 'px'; cv.style.height = cv.height + 'px'; draw(); }
  function mk(w, h) { var c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
  function preview(opt) {
    var c = S.toCanvas(S.fromArt(art(), opt || {}), mk);
    pc.imageSmoothingEnabled = false; pc.clearRect(0, 0, pv.width, pv.height); pc.drawImage(c, 0, 0, pv.width, pv.height);
  }
  function after() { draw(); save(); preview(); }

  /* ---------- tools ---------- */
  function put(g, x, y, k) { if (x >= 0 && y >= 0 && x < SW && y < SH) g[y][x] = k; }
  function line(g, x0, y0, x1, y1, k) {
    var dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1, e = dx + dy;
    for (;;) { put(g, x0, y0, k); if (x0 === x1 && y0 === y1) break; var e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } }
  }
  function box(g, x0, y0, x1, y1, k) {
    for (var y = Math.min(y0, y1); y <= Math.max(y0, y1); y++) for (var x = Math.min(x0, x1); x <= Math.max(x0, x1); x++) put(g, x, y, k);
  }
  function fill(g, x, y, k) {
    var tg = g[y][x]; if (tg === k) return; var st = [[x, y]];
    while (st.length) { var p = st.pop(), px = p[0], py = p[1]; if (px < 0 || py < 0 || px >= SW || py >= SH || g[py][px] !== tg) continue; g[py][px] = k; st.push([px + 1, py], [px - 1, py], [px, py + 1], [px, py - 1]); }
  }
  function push() { undo[cur].push(JSON.stringify(rows(F[cur]))); if (undo[cur].length > 100) undo[cur].shift(); redo[cur] = []; }
  function doUndo() { var u = undo[cur]; if (!u.length) return; redo[cur].push(JSON.stringify(rows(F[cur]))); F[cur] = toGrid(JSON.parse(u.pop())); after(); }
  function doRedo() { var r = redo[cur]; if (!r.length) return; undo[cur].push(JSON.stringify(rows(F[cur]))); F[cur] = toGrid(JSON.parse(r.pop())); after(); }
  function nudge(dx, dy) {
    push(); var g = F[cur], n = blank();
    for (var y = 0; y < SH; y++) for (var x = 0; x < SW; x++) { var nx = x + dx, ny = y + dy; if (nx >= 0 && ny >= 0 && nx < SW && ny < SH) n[ny][nx] = g[y][x]; }
    F[cur] = n; after();
  }
  function pos(e) { var r = cv.getBoundingClientRect(); return [Math.floor((e.clientX - r.left) / r.width * SW), Math.floor((e.clientY - r.top) / r.height * SH)]; }

  cv.addEventListener('pointerdown', function (e) {
    e.preventDefault(); var p = pos(e);
    if (p[0] < 0 || p[1] < 0 || p[0] >= SW || p[1] >= SH) return;
    var g = F[cur], k = tool === 'erase' ? '.' : col;
    if (tool === 'pick') { var c = g[p[1]][p[0]]; if (c !== '.') { col = c; tool = 'pen'; ui(); } return; }
    cv.setPointerCapture(e.pointerId); push(); down = true; start = last = p; snap = clone(g);
    if (tool === 'fill') fill(g, p[0], p[1], k); else if (tool === 'pen' || tool === 'erase') put(g, p[0], p[1], k);
    draw();
  });
  cv.addEventListener('pointermove', function (e) {
    if (!down) return; var p = pos(e), k = tool === 'erase' ? '.' : col;
    if (tool === 'pen' || tool === 'erase') { line(F[cur], last[0], last[1], p[0], p[1], k); last = p; }
    else if (tool === 'line' || tool === 'box') { F[cur] = clone(snap); (tool === 'line' ? line : box)(F[cur], start[0], start[1], p[0], p[1], k); }
    draw();
  });
  function up() { if (down) { down = false; save(); preview(); } }
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

  /* ---------- interface ---------- */
  function ui() {
    $('tools').innerHTML = [['pen', 'Pen'], ['erase', 'Erase'], ['fill', 'Fill'], ['pick', 'Pick'], ['line', 'Line'], ['box', 'Box']].map(function (x) {
      return '<button data-t="' + x[0] + '"' + (tool === x[0] ? ' class="on"' : '') + '>' + x[1] + '</button>';
    }).join('');
    $('tabs').innerHTML = NAMES.map(function (n) { return '<button data-f="' + n + '"' + (cur === n ? ' class="on"' : '') + '>' + LABEL[n] + '</button>'; }).join('');
    $('pal').innerHTML = Object.keys(PAL).map(function (k) {
      return '<button class="sw' + (col === k ? ' on' : '') + '" data-k="' + k + '" style="background:' + PAL[k] + '" title="' + k + '"></button>';
    }).join('');
    if ($('cc').value !== PAL[col]) $('cc').value = PAL[col] || '#000000';
  }
  $('tools').onclick = function (e) { var v = e.target.getAttribute('data-t'); if (v) { tool = v; ui(); } };
  $('tabs').onclick = function (e) { var v = e.target.getAttribute('data-f'); if (v) { cur = v; ui(); draw(); } };
  $('pal').onclick = function (e) { var v = e.target.getAttribute('data-k'); if (v) { col = v; if (tool === 'erase' || tool === 'pick') tool = 'pen'; ui(); } };
  $('cc').oninput = function () { PAL[col] = this.value; ui(); draw(); save(); preview(); };
  $('add').onclick = function () {
    var cs = 'acefjklmoqrsuxzACDEIJKLMQRTUVXYZ0123456789', k = '';
    for (var i = 0; i < cs.length; i++) if (!(cs[i] in PAL)) { k = cs[i]; break; }
    if (!k) { msg('Palette is full'); return; }
    PAL[k] = '#ff00ff'; col = k; tool = 'pen'; ui();
  };
  $('undo').onclick = doUndo; $('redo').onclick = doRedo;
  $('nL').onclick = function () { nudge(-1, 0); }; $('nR').onclick = function () { nudge(1, 0); };
  $('nU').onclick = function () { nudge(0, -1); }; $('nD').onclick = function () { nudge(0, 1); };
  $('cfb').onclick = function () { if (cur === 'base') return; push(); F[cur] = clone(F.base); after(); };
  $('clr').onclick = function () { push(); F[cur] = blank(); after(); };
  $('z').oninput = function () { zoom = +this.value; size(); };
  $('gr').onchange = draw; $('on').onchange = draw;
  $('an').onclick = function () { anim = !anim; this.textContent = 'Animation: ' + (anim ? 'on' : 'off'); this.className = anim ? 'on' : ''; if (!anim) preview(); };
  document.addEventListener('keydown', function (e) {
    if (!(e.ctrlKey || e.metaKey)) return;
    if (e.key === 'z') { e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); }
    else if (e.key === 'y') { e.preventDefault(); doRedo(); }
  });
  function fresh() { resetHist(); ui(); size(); preview(); save(); }
  $('ld').onclick = function () { if (window.AspenSpriteArt) loadArt(window.AspenSpriteArt); else loadProc(); fresh(); msg('Loaded what the site uses right now'); };
  $('rs').onclick = function () { if (confirm('Throw away your edits and start from the generated sprite?')) { loadProc(); fresh(); } };

  /* ---------- export / import ---------- */
  function text() { return '/* Aspen sprite art, made with editor.html. Put this file at js/shark-art.js and reload the site. */\nwindow.AspenSpriteArt = ' + JSON.stringify(art(), null, 1) + ';\n'; }
  $('dl').onclick = function () {
    var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text()], { type: 'text/javascript' }));
    a.download = 'shark-art.js'; document.body.appendChild(a); a.click(); a.remove(); msg('Downloaded shark-art.js');
  };
  function fallback(s) { var o = $('out'); o.style.display = 'block'; o.value = s; o.select(); msg('Select all and copy'); }
  $('cp').onclick = function () {
    var s = text();
    if (navigator.clipboard) navigator.clipboard.writeText(s).then(function () { msg('Copied!'); }, function () { fallback(s); }); else fallback(s);
  };
  $('imp').onchange = function () {
    var f = this.files[0]; if (!f) return; var r = new FileReader();
    r.onload = function () {
      try {
        var tx = r.result, a = JSON.parse(tx.slice(tx.indexOf('{'), tx.lastIndexOf('}') + 1));
        if (a.base && a.base.length === SH) { loadArt(a); fresh(); msg('Imported'); } else msg('That is not a sprite file');
      } catch (e) { msg('Could not read that file'); }
    };
    r.readAsText(f);
  };

  /* ---------- start ---------- */
  var d = null; try { d = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (d && d.base && d.base.length === SH) loadArt(d); else if (window.AspenSpriteArt) loadArt(window.AspenSpriteArt); else loadProc();
  $('z').value = zoom; resetHist(); ui(); size(); preview();
  setInterval(function () {
    if (!anim) return; t++;
    preview({ blink: t % 12 === 0, swing: (t >> 2) & 1, tail: [0, 1, 2, 1][t % 4] });
  }, 350);
})();
</script>
</body>
</html>
